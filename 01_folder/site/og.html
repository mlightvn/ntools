<!doctype html>
<!-- Social preview image of nexplorer.vietkeys.com (static/og.png, 1200 x 630). Rebuild after changing it:
     chrome --headless --hide-scrollbars --window-size=1200,630 --screenshot=static\og.png og.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(700px 420px at 85% 0%, rgba(25, 240, 255, 0.16), transparent 70%),
      linear-gradient(rgba(127, 200, 215, 0.05) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, rgba(127, 200, 215, 0.05) 1px, transparent 1px) 0 0 / 40px 40px,
      #02060a;
    color: #d6f6fb;
    font-family: Rajdhani, Bahnschrift, "Segoe UI", sans-serif;
    position: relative;
  }
  .frame { position: absolute; inset: 40px; border: 1px solid rgba(127, 200, 215, 0.16); border-radius: 8px; }
  .frame::before, .frame::after { content: ""; position: absolute; width: 26px; height: 26px; border: 3px solid #19f0ff; }
  .frame::before { top: -3px; left: -3px; border-right: 0; border-bottom: 0; border-top-left-radius: 8px; }
  .frame::after { bottom: -3px; right: -3px; border-left: 0; border-top: 0; border-bottom-right-radius: 8px; }
  .brand { position: absolute; left: 96px; top: 92px; display: flex; align-items: center; gap: 22px; font-size: 56px; font-weight: 700; }
  .brand svg { width: 84px; height: 84px; filter: drop-shadow(0 0 14px rgba(25, 240, 255, 0.6)); }
  h1 { position: absolute; left: 96px; top: 222px; margin: 0; font-size: 64px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; }
  h1 em { font-style: normal; color: #19f0ff; }
  .sub { position: absolute; left: 96px; top: 392px; font: 500 27px "Cascadia Mono", Consolas, monospace; color: #7fa3ad; }
  .dots { position: absolute; left: 96px; bottom: 98px; display: flex; gap: 14px; }
  .dots span { width: 22px; height: 22px; border-radius: 50%; }
  .url { position: absolute; right: 96px; bottom: 96px; font: 500 28px "Cascadia Mono", Consolas, monospace; color: #19f0ff; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="brand"><svg viewBox="0 0 64 64"><path d="M32 3 57 17.5v29L32 61 7 46.5v-29Z" fill="#061016" stroke="#19f0ff" stroke-width="4" stroke-linejoin="round"/><path d="M18 21h10l3 4h15v18H18Z" fill="#0d4b54" stroke="#19f0ff" stroke-width="2.5" stroke-linejoin="round"/><path d="M18 29h28" stroke="#19f0ff" stroke-width="2"/></svg>nExplorer</div>
  <h1>The file manager Windows Explorer<br><em>should have been</em></h1>
  <div class="sub">3 panes · tabs · instant search · 6 themes · one small exe</div>
  <div class="dots"><span style="background:#19f0ff"></span><span style="background:#4a90e2"></span><span style="background:#8b5cf6"></span><span style="background:#4ade80"></span><span style="background:#0a84ff"></span><span style="background:#e8edf3"></span></div>
  <div class="url">nexplorer.vietkeys.com</div>
</body>
</html>
